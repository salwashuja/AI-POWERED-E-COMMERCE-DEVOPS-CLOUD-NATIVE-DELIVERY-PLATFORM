apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
  name: annotated
spec:
  ingressClassName: alb
  rules:
  - host: example.com
    http:
      paths:
      - backend:
          service:
            name: opentelemetry-demo-frontendproxy
            port:
              number: 8080
        path: /
        pathType: Exact
  tls:
  - hosts:
    - example.com
    secretName: my-cert
status:
  loadBalancer: {}
