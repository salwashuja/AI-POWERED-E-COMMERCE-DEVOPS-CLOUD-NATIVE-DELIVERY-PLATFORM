name: product-catalog-ci
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up go
        uses: actions/setup-go@v4
        with:
          go-version: '1.19'
      - name: Install and build dependencies
        run: |
         cd src/product-catalog 
         go mod download 
         go build -o product-catalog main.go
      - name: Run tests
        run: |
         cd src/product-catalog 
         go test ./...

  code-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up go
        uses: actions/setup-go@v4
        with:
          go-version: '1.19'
      - name: Install golangci-lint

        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.52.2
      - name: Run golangci-lint
        run: |
          cd src/product-catalog
          golangci-lint run ./...   

  docker-build:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3  
      
      - name: install docker
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: "wajhip"
          password: ${{ secrets.DOCKER_PASSWORD }}
     
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./src/product-catalog
          file: ./src/product-catalog/Dockerfile
          push: true
          tags: wajhip/product-catalog:${{ github.run_id }}
         
  update-k8s-deployment:

      runs-on: ubuntu-latest
      needs: [build, docker-build]
      steps:
        - name: Checkout code
          uses: actions/checkout@v4
          with: 
            token: ${{ secrets.TOKEN }}

        - name: update tags in kubernetes deployment
          run: |
             sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml

        - name: git commit and push changes
          run: |
             git config --global user.name "salwaparach"
             git config --global user.email "salwaparacha1999@gmail.com"
             git add kubernetes/productcatalog/deploy.yaml
             git commit -m "Update image tag to ${{github.run_id}}"
             git push origin main


        
